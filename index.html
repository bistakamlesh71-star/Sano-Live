
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080D1D">
<title>SANO LIVE</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
 background:#080D1D;
 color:white;
 font-family:Arial,sans-serif;
}
.app{
 max-width:500px;
 min-height:100vh;
 margin:auto;
 padding:18px 16px 110px;
}
.header{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-bottom:23px;
}
.logo{
 font-size:26px;
 font-weight:900;
 letter-spacing:1px;
 background:linear-gradient(90deg,#00D9FF,#9875FF,#FF2780);
 -webkit-background-clip:text;
 color:transparent;
}
.icon-btn{
 background:#121C30;
 border:1px solid #26344B;
 color:white;
 padding:12px;
 border-radius:12px;
 font-size:18px;
}
.search{
 display:flex;
 gap:10px;
 align-items:center;
 background:#121C30;
 border:1px solid #26344B;
 border-radius:14px;
 padding:14px;
 margin-bottom:22px;
}
.search input{
 background:none;
 border:none;
 outline:none;
 color:white;
 width:100%;
 font-size:14px;
}
.search input::placeholder{color:#8190A8}
.hero{
 padding:28px 20px;
 border-radius:22px;
 border:1px solid #3A3B64;
 background:
 radial-gradient(circle at 90% 10%,#53358A 0%,transparent 40%),
 linear-gradient(135deg,#182440,#15172F,#102D40);
 margin-bottom:27px;
}
.hero-tag{
 color:#00D9FF;
 font-size:11px;
 font-weight:bold;
 letter-spacing:2px;
 margin-bottom:15px;
}
.hero h1{
 font-size:30px;
 line-height:1.3;
 margin-bottom:10px;
}
.hero p{
 color:#AAB8CC;
 font-size:13px;
 line-height:1.6;
 margin-bottom:19px;
}
.explore-btn{
 background:linear-gradient(90deg,#9875FF,#00D9FF);
 color:white;
 border:0;
 padding:12px 20px;
 border-radius:11px;
 font-weight:bold;
}
.section{margin-bottom:25px}
.section-head{margin-bottom:14px}
.section-head h2{font-size:19px}
.empty{
 min-height:150px;
 border:1px solid #26344B;
 border-radius:17px;
 background:linear-gradient(145deg,#121C30,#10182A);
 display:flex;
 justify-content:center;
 align-items:center;
 flex-direction:column;
 gap:10px;
 color:#8493AB;
 font-size:13px;
}
.empty-icon{font-size:30px}
.go-live{
 position:fixed;
 bottom:83px;
 right:20px;
 width:58px;
 height:58px;
 border-radius:19px;
 background:linear-gradient(135deg,#FF2780,#9875FF);
 color:white;
 font-size:27px;
 box-shadow:0 0 25px #9875FF55;
 border:0;
}
.bottom-nav{
 position:fixed;
 bottom:0;
 left:0;
 width:100%;
 background:#0D1526;
 border-top:1px solid #26344B;
 display:flex;
 justify-content:space-around;
 padding:12px 3px 19px;
 z-index:10;
}
.nav-item{
 background:none;
 border:0;
 color:#8290A7;
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:5px;
 font-size:10px;
}
.nav-item span{font-size:20px}
.nav-item.active{color:#00D9FF}
@media(min-width:501px){
 body{background:#050913}
 .app{border-left:1px solid #202D43;border-right:1px solid #202D43}
}
</style>
</head>

<body>
<div class="app">

<header class="header">
 <div class="logo">SANO LIVE</div>
 <button class="icon-btn">🔔</button>
</header>

<div class="search">
 🔍
 <input type="text" placeholder="Search users, live rooms...">
</div>

<div class="hero">
 <div class="hero-tag">✨ WELCOME TO SANO LIVE</div>
 <h1>Your World.<br>Your Live.</h1>
 <p>Connect with friends and enjoy beautiful live moments.</p>
 <button class="explore-btn">Explore Live →</button>
</div>

<section class="section">
 <div class="section-head">
  <h2>🔴 Live Now</h2>
 </div>

 <div class="empty">
  <div class="empty-icon">📡</div>
  No Live Streams Yet
 </div>
</section>

</div>

<button class="go-live" onclick="alert('Go Live Coming Soon')">＋</button>

<nav class="bottom-nav">
 <button class="nav-item active"><span>⌂</span>Home</button>
 <button class="nav-item"><span>🔎</span>Explore</button>
 <button class="nav-item"><span>🎙️</span>Party</button>
 <button class="nav-item"><span>💬</span>Messages</button>
 <button class="nav-item"><span>👤</span>Profile</button>
</nav>

</body>
</html>
